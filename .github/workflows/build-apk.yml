name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Quick tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install numpy opencv-python-headless pytest

      - name: Run tests (skipped if no tests folder)
        run: |
          if [ -d tests ]; then python -m pytest -q tests; else echo "No tests folder, skipping"; fi

  build-android:
    name: Build lite debug APK
    needs: test
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config cmake \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 virtualenv "setuptools<81"

      - name: Cache Buildozer (SDK, NDK, compiled recipes)
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-v3-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show the real error (only runs if build failed)
        if: failure()
        run: |
          echo "=============== LINES BEFORE 'Command failed' ==============="
          n=$(grep -n "# Command failed" build.log | head -1 | cut -d: -f1)
          if [ -n "$n" ]; then sed -n "$((n>80 ? n-80 : 1)),$((n))p" build.log; fi
          echo "=============== ERROR LINES ==============="
          grep -n -i -E "error|failed|not found|cannot|undefined reference" build.log | grep -v "ENVIRONMENT" | tail -40

      - name: Put the error tail in the job summary (failure only)
        if: failure()
        run: |
          {
            echo '## Last 120 lines of build.log'
            echo '```'
            tail -n 120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OCR-Scanner-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: build.log
          if-no-files-found: ignore
